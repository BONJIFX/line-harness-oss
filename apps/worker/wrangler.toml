name = "csa-line-harness"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true

# ═══════════════════════════════════════════════════════════════
# CSA 環境 (paison0357@gmail.com)
# 使い方: npx wrangler deploy
# ═══════════════════════════════════════════════════════════════
account_id = "00af307b3e516ed14ba6b2a886304412"

# CSA 申込フォーム後押しリマインドのグローバル安全スイッチ。"true" 以外は
# 全てドライラン(対象件数のログ出力のみ、実送信・DB書き込みなし)。
# CSA_REMINDER_EPOCH (ISO日時、JST) より前に申込プロセスを開始した申込へは
# 送らない(2026-07-28 BONJI 裁定「今後のみに決まってるじゃん」)。
[vars]
CSA_REMINDER_AUTO_SEND = "false"
CSA_REMINDER_EPOCH = "2026-07-28T21:50:00+09:00"

[assets]
directory = "dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "csa-line-harness"
database_id = "ae45eb8c-c543-40ec-be7a-01a9f27bccfd"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "csa-line-harness-images"

[triggers]
crons = ["*/5 * * * *"]

# ═══════════════════════════════════════════════════════════════
# 本番環境 (aiagent.mini@)
# 使い方: npx wrangler deploy --env production --name your-worker-name
# D1:     npx wrangler d1 execute line-crm --env production --remote --file ...
# ═══════════════════════════════════════════════════════════════
[env.production]
account_id = "YOUR_ACCOUNT_ID"

[env.production.vars]
CSA_REMINDER_AUTO_SEND = "false"
CSA_REMINDER_EPOCH = ""

[env.production.assets]
directory = "dist/client"
binding = "ASSETS"

[[env.production.d1_databases]]
binding = "DB"
database_name = "line-crm"
database_id = "YOUR_D1_DATABASE_ID"

[[env.production.r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images"

[env.production.triggers]
crons = ["*/5 * * * *"]
